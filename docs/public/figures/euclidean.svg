<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="欧几里得节奏"><style>
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#334155}
