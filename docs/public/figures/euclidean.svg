</style><rect x="0.5" y="0.5" width="759" height="239" rx="12" fill="#fbfcfe" stroke="#e2e8f0"/><text x="28" y="28" class="title">欧几里得节奏：把 k 个重音尽量均匀地撒进 n 个格子</text><circle cx="130" cy="118" r="76" fill="none" stroke="#e2e8f0" stroke-width="1.4"/><circle cx="130.0" cy="42.0" r="9" fill="#0f766e"/><circle cx="183.7" cy="64.3" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="206.0" cy="118.0" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="183.7" cy="171.7" r="9" fill="#0f766e"/><circle cx="130.0" cy="194.0" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="76.3" cy="171.7" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="54.0" cy="118.0" r="9" fill="#0f766e"/><circle cx="76.3" cy="64.3" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="130" y="220" text-anchor="middle" class="lbl mono">E(3,8) = x..x..x.</text><circle cx="380" cy="118" r="76" fill="none" stroke="#e2e8f0" stroke-width="1.4"/><circle cx="380.0" cy="42.0" r="9" fill="#0f766e"/><circle cx="433.7" cy="64.3" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="456.0" cy="118.0" r="9" fill="#0f766e"/><circle cx="433.7" cy="171.7" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="380.0" cy="194.0" r="9" fill="#0f766e"/><circle cx="326.3" cy="171.7" r="9" fill="#0f766e"/><circle cx="304.0" cy="118.0" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="326.3" cy="64.3" r="9" fill="#0f766e"/><text x="380" y="220" text-anchor="middle" class="lbl mono">E(5,8) = x.x.xx.x</text><circle cx="630" cy="118" r="76" fill="none" stroke="#e2e8f0" stroke-width="1.4"/><circle cx="630.0" cy="42.0" r="9" fill="#0f766e"/><circle cx="665.3" cy="50.7" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="692.5" cy="74.8" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><circle cx="705.4" cy="108.8" r="9" fill="#0f766e"/><circle cx="701.1" cy="144.9" r="7