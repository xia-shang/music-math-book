</style><rect x="0.5" y="0.5" width="459" height="459" rx="12" fill="#fbfcfe" stroke="#e2e8f0"/><text x="24" y="28" class="title">五度圈：每次 +7 个半音，12 步回到原点</text><circle cx="230" cy="224" r="148" fill="none" stroke="#e2e8f0" stroke-width="1.6"/><circle cx="230.0" cy="76.0" r="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.4"/><text x="230.0" y="80.0" text-anchor="middle" class="lbl mono" fill="#ffffff">0</text><text x="230.0" y="54.0" text-anchor="middle" class="lbl" fill="#0f172a">C</text><circle cx="304.0" cy="95.8" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="304.0" y="99.8" text-anchor="middle" class="lbl mono" fill="#0f766e">1</text><text x="317.0" y="77.3" text-anchor="middle" class="lbl" fill="#0f172a">G</text><circle cx="358.2" cy="150.0" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="358.2" y="154.0" text-anchor="middle" class="lbl mono" fill="#0f766e">2</text><text x="380.7" y="141.0" text-anchor="middle" class="lbl" fill="#0f172a">D</text><circle cx="378.0" cy="224.0" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="378.0" y="228.0" text-anchor="middle" class="lbl mono" fill="#0f766e">3</text><text x="404.0" y="228.0" text-anchor="middle" class="lbl" fill="#0f172a">A</text><circle cx="358.2" cy="298.0" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="358.2" y="302.0" text-anchor="middle" class="lbl mono" fill="#0f766e">4</text><text x="380.7" y="315.0" text-anchor="middle" class="lbl" fill="#0f172a">E</text><circle cx="304.0" cy="352.2" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="304.0" y="356.2" text-anchor="middle" class="lbl mono" fill="#0f766e">5</text><text x="317.0" y="378.7" text-anchor="middle" class="lbl" fill="#0f172a">B</text><circle cx="230.0" cy="372.0" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="230.0" y="376.0" text-anchor="middle" class="lbl mono" fill="#0f766e">6</text><text x="230.0" y="402.0" text-anchor="middle" class="lbl" fill="#0f172a">F♯</text><circle cx="156.0" cy="352.2" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="156.0" y="356.2" text-anchor="middle" class="lbl mono" fill="#0f766e">7</text><text x="143.0" y="378.7" text-anchor="middle" class="lbl" fill="#0f172a">D♭</text><circle cx="101.8" cy="298.0" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="101.8" y="302.0" text-anchor="middle" class="lbl mono" fill="#0f766e">8</text><text x="79.3" y="315.0" text-anchor="middle" class="lbl" fill="#0f172a">A♭</text><circle cx="82.0" cy="224.0" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="82.0" y="228.0" text-anchor="middle" class="lbl mono" fill="#0f766e">9</text><text x="56.0" y="228.0" text-anchor="middle" class="lbl" fill="#0f172a">E♭</text><circle cx="101.8" cy="150.0" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="101.8" y="154.0" text-anchor="middle" class="lbl mono" fill="#0f766e">10</text><text x="79.3" y="141.0" text-anchor="middle" class="lbl" fill="#0f172a">B♭</text><circle cx="156.0" cy="95.8" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="156.0" y="99.8" text-anchor="middle" class="lbl mono" fill="#0f766e">11</text><text x="143.0" y="77.3" text-anchor="middle" class="lbl" fill="#0f172a">F</text><text x="230" y="218" text-anchor="middle" class="lbl" fill="#0f172a">五度圈</text><text x="230" y="238" text-anchor="middle" class="tick mono">S¹</text><text x="24" y="442" class="tick">内圈是音级编号（C=0）。7 与 12 互质，所以这个旋转能遍历全部 12 个点。</text></svg>