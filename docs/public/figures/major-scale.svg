<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" width="520" height="500" role="img" aria-label="大调音阶的间距结构"><style>
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#334155}
